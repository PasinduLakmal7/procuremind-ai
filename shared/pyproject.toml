[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shared"
version = "0.1.0"
description = "Shared engineering utilities for Procurement Intelligence Platform"
authors = [{ name = "Procurement Intelligence Team" }]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "starlette>=0.37.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]

