# Traefik Static Configuration
global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO
  format: json

accessLog:
  format: json

entryPoints:
  web:
    address: ":80"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "procurement-network"
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

api:
  dashboard: false
  insecure: false

ping: {}


